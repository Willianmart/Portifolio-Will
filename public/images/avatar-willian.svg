<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Avatar tecnológico de Willian Martinez">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1a2450"/>
      <stop offset="55%" stop-color="#0c1020"/>
      <stop offset="100%" stop-color="#08090D"/>
    </radialGradient>
    <linearGradient id="core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C5CFC"/>
      <stop offset="50%" stop-color="#5B8CFF"/>
      <stop offset="100%" stop-color="#2EC4B6"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5B8CFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7C5CFC" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <circle cx="186" cy="64" r="36" fill="#7C5CFC" opacity="0.18" filter="url(#soft)"/>
  <circle cx="64" cy="190" r="44" fill="#2EC4B6" opacity="0.12" filter="url(#soft)"/>
  <!-- orbit rings -->
  <circle cx="128" cy="128" r="86" fill="none" stroke="url(#ring)" stroke-width="1.5" opacity="0.7"/>
  <circle cx="128" cy="128" r="68" fill="none" stroke="#5B8CFF" stroke-width="1" stroke-dasharray="4 8" opacity="0.45"/>
  <!-- neural nodes -->
  <g stroke="#A78BFA" stroke-width="1.25" opacity="0.85">
    <line x1="88" y1="96" x2="128" y2="118"/>
    <line x1="168" y1="96" x2="128" y2="118"/>
    <line x1="128" y1="118" x2="128" y2="150"/>
    <line x1="98" y1="168" x2="128" y2="150"/>
    <line x1="158" y1="168" x2="128" y2="150"/>
    <line x1="88" y1="96" x2="98" y2="168"/>
    <line x1="168" y1="96" x2="158" y2="168"/>
  </g>
  <g>
    <circle cx="88" cy="96" r="7" fill="#5B8CFF"/>
    <circle cx="168" cy="96" r="7" fill="#7C5CFC"/>
    <circle cx="128" cy="118" r="9" fill="url(#core)"/>
    <circle cx="128" cy="150" r="8" fill="#2EC4B6"/>
    <circle cx="98" cy="168" r="6" fill="#5B8CFF"/>
    <circle cx="158" cy="168" r="6" fill="#A78BFA"/>
  </g>
  <!-- brand mark -->
  <text x="128" y="218" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5" fill="#F5F7FA" opacity="0.92">WillianMart<tspan fill="#7C5CFC">.DEV</tspan></text>
</svg>
