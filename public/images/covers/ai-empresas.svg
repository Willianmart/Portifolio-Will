<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="Ilustração PoC de IA empresarial / RAG">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0C0618"/>
      <stop offset="50%" stop-color="#1A0C35"/>
      <stop offset="100%" stop-color="#2A1450"/>
    </linearGradient>
    <radialGradient id="aiGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0L6 3L0 6Z" fill="#C4B5FD"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="url(#aiBg)"/>
  <rect width="960" height="600" fill="url(#aiGlow)"/>
  <!-- document stack (knowledge base) -->
  <g transform="translate(90 160)">
    <rect width="200" height="260" rx="16" fill="#1B1033" stroke="#A78BFA" stroke-opacity="0.4"/>
    <rect x="22" y="28" width="156" height="12" rx="6" fill="#A78BFA" fill-opacity="0.45"/>
    <rect x="22" y="56" width="130" height="8" rx="4" fill="#ffffff" fill-opacity="0.15"/>
    <rect x="22" y="76" width="148" height="8" rx="4" fill="#ffffff" fill-opacity="0.12"/>
    <rect x="22" y="96" width="110" height="8" rx="4" fill="#ffffff" fill-opacity="0.12"/>
    <rect x="22" y="130" width="156" height="70" rx="10" fill="#A78BFA" fill-opacity="0.12"/>
    <text x="100" y="172" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#C4B5FD">Docs</text>
    <rect x="22" y="220" width="70" height="18" rx="9" fill="#7C5CFC" fill-opacity="0.35"/>
    <rect x="100" y="220" width="70" height="18" rx="9" fill="#5B8CFF" fill-opacity="0.3"/>
  </g>
  <!-- embedding / chunk nodes -->
  <g transform="translate(360 200)">
    <circle cx="0" cy="40" r="28" fill="#A78BFA" fill-opacity="0.2" stroke="#A78BFA" stroke-opacity="0.7"/>
    <circle cx="70" cy="0" r="22" fill="#7C5CFC" fill-opacity="0.25" stroke="#7C5CFC" stroke-opacity="0.7"/>
    <circle cx="70" cy="90" r="22" fill="#5B8CFF" fill-opacity="0.25" stroke="#5B8CFF" stroke-opacity="0.7"/>
    <circle cx="140" cy="40" r="26" fill="#C4B5FD" fill-opacity="0.18" stroke="#C4B5FD" stroke-opacity="0.7"/>
    <path d="M28 40H48M70 22V68M92 40H114" stroke="#C4B5FD" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="70" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" letter-spacing="2" fill="#C4B5FD">CHUNKS / EMBEDDINGS</text>
  </g>
  <!-- query → model → answer -->
  <g transform="translate(620 170)">
    <rect width="240" height="70" rx="14" fill="#1B1033" stroke="#A78BFA" stroke-opacity="0.35"/>
    <text x="24" y="42" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#EDE9FE">Consulta</text>
    <path d="M120 80v40" stroke="#C4B5FD" stroke-width="2" marker-end="url(#arrow)"/>
    <rect y="130" width="240" height="90" rx="16" fill="#241245" stroke="#7C5CFC" stroke-opacity="0.55"/>
    <circle cx="48" cy="175" r="16" fill="#7C5CFC" fill-opacity="0.35" stroke="#A78BFA"/>
    <circle cx="48" cy="175" r="5" fill="#EDE9FE"/>
    <rect x="78" y="160" width="130" height="8" rx="4" fill="#A78BFA" fill-opacity="0.45"/>
    <rect x="78" y="178" width="100" height="8" rx="4" fill="#ffffff" fill-opacity="0.15"/>
    <text x="120" y="248" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#C4B5FD">Modelo · RAG (PoC)</text>
  </g>
  <!-- flow arrows from docs -->
  <path d="M290 290 C330 290, 340 240, 360 240" fill="none" stroke="#A78BFA" stroke-opacity="0.45" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M500 240 C560 240, 580 205, 620 205" fill="none" stroke="#A78BFA" stroke-opacity="0.45" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="72" y="540" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="600" fill="#F5F7FA">IA para empresas</text>
  <text x="72" y="572" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" letter-spacing="2" fill="#C4B5FD">PESQUISA · PROVA DE CONCEITO · NÃO É PRODUTO</text>
</svg>
