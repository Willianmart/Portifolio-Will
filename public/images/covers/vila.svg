    <rect x="760" y="158" width="70" height="8" rx="4" fill="#2EC4B6" fill-opacity="0.35"/>
    <rect x="690" y="230" width="200" height="100" rx="14" fill="#0B2228" stroke="#2EC4B6" stroke-opacity="0.2"/>
