      <stop offset="0%" stop-color="#041016"/>
      <stop offset="50%" stop-color="#0A242C"/>
      <stop offset="100%" stop-color="#0E3A40"/>
    </linearGradient>
    <radialGradient id="vilaGlow" cx="30%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#2EC4B6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2EC4B6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vilaBar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2EC4B6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2EC4B6"/>
    </linearGradient>
  </defs>
  <rect width="960" height="600" fill="url(#vilaBg)"/>
  <rect width="960" height="600" fill="url(#vilaGlow)"/>
  <!-- window chrome -->
  <rect x="48" y="48" width="864" height="460" rx="20" fill="#071A20" stroke="#2EC4B6" stroke-opacity="0.28"/>
  <circle cx="78" cy="78" r="6" fill="#FF6B6B" fill-opacity="0.7"/>
  <circle cx="98" cy="78" r="6" fill="#FFD166" fill-opacity="0.7"/>
  <circle cx="118" cy="78" r="6" fill="#2EC4B6" fill-opacity="0.7"/>
  <rect x="150" y="70" width="180" height="14" rx="7" fill="#2EC4B6" fill-opacity="0.2"/>
