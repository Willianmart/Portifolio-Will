    <rect x="48" y="50" width="28" height="90" rx="4" fill="url(#vilaBar)"/>
    <rect x="96" y="95" width="28" height="45" rx="4" fill="url(#vilaBar)"/>
    <rect x="144" y="30" width="28" height="110" rx="4" fill="url(#vilaBar)"/>
    <rect x="192" y="65" width="28" height="75" rx="4" fill="url(#vilaBar)"/>
    <rect x="240" y="40" width="28" height="100" rx="4" fill="url(#vilaBar)"/>
    <rect x="288" y="85" width="28" height="55" rx="4" fill="url(#vilaBar)"/>
    <path d="M14 70 C50 20, 90 110, 130 45 S210 10, 300 55" fill="none" stroke="#7AD9CF" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
