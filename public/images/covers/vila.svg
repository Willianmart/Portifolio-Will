  <text x="270" y="380" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#7FCFC6">Unidades de saúde — composição ilustrativa</text>
  <rect x="48" y="528" width="864" height="36" rx="10" fill="#04161A" stroke="#2EC4B6" stroke-opacity="0.25" stroke-dasharray="4 4"/>
  <text x="480" y="551" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" letter-spacing="1" fill="#7FCFC6">ILUSTRAÇÃO — SEM ESTATÍSTICAS REAIS · VILA</text>
