    <circle cx="390" cy="390" r="8" fill-opacity="0.4"/>
    <circle cx="470" cy="420" r="12" fill-opacity="0.5"/>
    <circle cx="560" cy="395" r="7" fill-opacity="0.35"/>
    <circle cx="640" cy="415" r="11" fill-opacity="0.45"/>
    <circle cx="740" cy="400" r="9" fill-opacity="0.4"/>
