<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="Ilustração Alysense — IA, dados e gestão">
  <defs>
    <linearGradient id="alyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B18"/>
      <stop offset="55%" stop-color="#0F1A3A"/>
      <stop offset="100%" stop-color="#15275A"/>
    </linearGradient>
    <radialGradient id="alyGlow" cx="72%" cy="28%" r="45%">
      <stop offset="0%" stop-color="#5B8CFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5B8CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="alyGlow2" cx="18%" cy="78%" r="40%">
      <stop offset="0%" stop-color="#7C5CFC" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7C5CFC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="alyLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5B8CFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8EB6FF"/>
      <stop offset="100%" stop-color="#7C5CFC" stop-opacity="0"/>
    </linearGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="960" height="600" fill="url(#alyBg)"/>
  <rect width="960" height="600" fill="url(#alyGlow)"/>
  <rect width="960" height="600" fill="url(#alyGlow2)"/>
  <!-- subtle grid -->
  <g stroke="#5B8CFF" stroke-opacity="0.08" stroke-width="1">
    <path d="M0 100h960M0 200h960M0 300h960M0 400h960M0 500h960"/>
    <path d="M120 0v600M240 0v600M360 0v600M480 0v600M600 0v600M720 0v600M840 0v600"/>
  </g>
  <!-- orbit rings -->
  <g fill="none" transform="translate(620 250)">
    <circle r="150" stroke="#5B8CFF" stroke-opacity="0.25" stroke-width="1.5"/>
    <circle r="110" stroke="#7C5CFC" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="6 10"/>
    <circle r="70" stroke="#8EB6FF" stroke-opacity="0.5" stroke-width="1.5"/>
    <circle r="18" fill="#5B8CFF" filter="url(#softBlur)" opacity="0.7"/>
    <circle r="10" fill="#E8F0FF"/>
    <!-- satellite nodes -->
    <circle cx="110" cy="-40" r="6" fill="#5B8CFF"/>
    <circle cx="-95" cy="55" r="5" fill="#7C5CFC"/>
    <circle cx="40" cy="100" r="4" fill="#A8C5FF"/>
    <path d="M0 0L110 -40M0 0L-95 55M0 0L40 100" stroke="#8EB6FF" stroke-opacity="0.45" stroke-width="1.2"/>
  </g>
  <!-- abstract data panels -->
  <g transform="translate(72 150)">
    <rect width="280" height="180" rx="18" fill="#10182F" stroke="#5B8CFF" stroke-opacity="0.35"/>
    <rect x="18" y="22" width="90" height="8" rx="4" fill="#5B8CFF" fill-opacity="0.55"/>
    <rect x="18" y="48" width="244" height="44" rx="10" fill="#5B8CFF" fill-opacity="0.12"/>
    <path d="M36 78 C70 50, 110 90, 140 62 S200 40, 240 55" fill="none" stroke="#5B8CFF" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="18" y="110" width="70" height="42" rx="10" fill="#7C5CFC" fill-opacity="0.2"/>
    <rect x="100" y="110" width="70" height="42" rx="10" fill="#5B8CFF" fill-opacity="0.18"/>
    <rect x="182" y="110" width="70" height="42" rx="10" fill="#2EC4B6" fill-opacity="0.18"/>
  </g>
  <path d="M0 540h960" stroke="url(#alyLine)" stroke-width="2"/>
  <text x="72" y="500" font-family="ui-sans-serif, system-ui, sans-serif" font-size="42" font-weight="700" fill="#F5F7FA">Alysense</text>
  <text x="72" y="538" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" letter-spacing="4" fill="#8EB6FF">IA · DADOS · GESTÃO</text>
</svg>
